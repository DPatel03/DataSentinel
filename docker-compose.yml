services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: datasentinel-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: datasentinel-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    hostname: timescaledb
    container_name: datasentinel-timescaledb
    ports:
      - "${TIMESCALEDB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datasentinel}
      POSTGRES_DB: ${POSTGRES_DB:-datasentinel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasentinel} -d ${POSTGRES_DB:-datasentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  schema-init:
    image: python:3.12-slim
    container_name: datasentinel-schema-init
    depends_on:
      schema-registry:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./ingestion:/app/ingestion:ro
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        pip install -q confluent-kafka==2.6.1 fastavro==1.9.7
        python ingestion/register_schemas.py --registry-url http://schema-registry:8081
    restart: "no"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: datasentinel-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "Creating Kafka topics..."
        for topic in taxi.rides.raw taxi.rides.validated taxi.rides.dead-letter taxi.rides.repaired taxi.rides.anomaly; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
          echo "  ✓ $$topic"
        done
        echo "Kafka topics ready."
    restart: "no"

  akhq:
    image: tchiotludo/akhq:0.25.1
    container_name: datasentinel-akhq
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${AKHQ_PORT:-8080}:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            datasentinel:
              properties:
                bootstrap.servers: kafka:29092
              schema-registry:
                url: http://schema-registry:8081
                type: confluent

  validator:
    profiles: ["pipeline"]
    build: .
    image: datasentinel-app:local
    container_name: datasentinel-validator
    command: python -m validation.streaming_validator
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TIMESCALEDB_DSN: postgresql://${POSTGRES_USER:-datasentinel}:${POSTGRES_PASSWORD:-datasentinel}@timescaledb:5432/${POSTGRES_DB:-datasentinel}
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  triage:
    profiles: ["pipeline"]
    build: .
    image: datasentinel-app:local
    container_name: datasentinel-triage
    command: python -m agents.triage_service --seed-prompts
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TIMESCALEDB_DSN: postgresql://${POSTGRES_USER:-datasentinel}:${POSTGRES_PASSWORD:-datasentinel}@timescaledb:5432/${POSTGRES_DB:-datasentinel}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      validator:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    profiles: ["pipeline"]
    build: .
    image: datasentinel-app:local
    container_name: datasentinel-dashboard
    command: uvicorn dashboard.api.main:app --host 0.0.0.0 --port 8888
    ports:
      - "${DASHBOARD_API_PORT:-8888}:8888"
    environment:
      PYTHONPATH: /app
      TIMESCALEDB_DSN: postgresql://${POSTGRES_USER:-datasentinel}:${POSTGRES_PASSWORD:-datasentinel}@timescaledb:5432/${POSTGRES_DB:-datasentinel}
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-http://localhost:3000,http://localhost:8888}
      DASHBOARD_AUTH_TOKEN: ${DASHBOARD_AUTH_TOKEN:-datasentinel-local}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  demo-seed:
    profiles: ["pipeline"]
    build: .
    image: datasentinel-app:local
    container_name: datasentinel-demo-seed
    command:
      - /bin/sh
      - -c
      - python scripts/migrate.py && python scripts/seed_demo.py
    environment:
      PYTHONPATH: /app
      TIMESCALEDB_DSN: postgresql://${POSTGRES_USER:-datasentinel}:${POSTGRES_PASSWORD:-datasentinel}@timescaledb:5432/${POSTGRES_DB:-datasentinel}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  producer:
    profiles: ["pipeline"]
    build: .
    image: datasentinel-app:local
    container_name: datasentinel-producer
    command:
      - /bin/sh
      - -c
      - |
        python scripts/generate_sample_parquet.py
        python -m ingestion.producer \
          --file data/yellow_tripdata_2019-01_sample.parquet \
          --max-records $${PRODUCER_MAX_RECORDS:-100} \
          --compression-factor 0
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PRODUCER_MAX_RECORDS: ${PRODUCER_MAX_RECORDS:-100}
    depends_on:
      validator:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  kafka_data:
  timescaledb_data:
