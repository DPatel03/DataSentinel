# Optional Airflow stack for prompt eval DAG
# Usage: docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d

services:
  airflow-init:
    image: apache/airflow:2.9.2-python3.12
    container_name: datasentinel-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datasentinel:datasentinel@timescaledb:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleQ==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - .:/opt/datasentinel:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@datasentinel.local || true
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.9.2-python3.12
    container_name: datasentinel-airflow
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datasentinel:datasentinel@timescaledb:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleQ==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - .:/opt/datasentinel:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.12
    container_name: datasentinel-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datasentinel:datasentinel@timescaledb:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleQ==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - .:/opt/datasentinel:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow_logs:
